services:
  api:
    build: .
    command: python -m uvicorn src.api:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://clinical_app:clinical_dev@postgres:5432/clinical_quality
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinical_quality
      POSTGRES_USER: clinical_app
      POSTGRES_PASSWORD: clinical_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinical_app -d clinical_quality"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - clinical_postgres_data:/var/lib/postgresql/data

volumes:
  clinical_postgres_data:
